<script>
const URL_PART1 = "https://google.com";
const URL_PART2 = "AKfycbw5UkKv8R6IOBq8CxKzMa3LZTnq5e24065Ehtn0xhu90Z86m79vd0nl-h3BKB5im0QM";
const URL_PART3 = "/exec";
const WEB_APP_URL = URL_PART1 + URL_PART2 + URL_PART3;

function getVal(id) {
 return parseInt(
 document.getElementById(id).value
 ) || 0;
}

function calculateLiveTotal() {
 var p = getVal('qty_pork');
 var a = getVal('qty_atay');
 var t = getVal('qty_tenga');
 var h = getVal('qty_hotdog');
 var sub = (p*50)+(a*30)+(t*30)+(h*30);
 
 var f = document.getElementById(
 'fulfillmentOpt'
 ).value;
 var fee = 0;
 var rg = document.getElementById(
 'roomGroup'
 );
 var ri = document.getElementById(
 'cRoom'
 );

 if (f.includes("Room")) {
 fee = 10;
 if (rg) rg.style.display = "block";
 if (ri) ri.required = true;
 } else {
 fee = 0;
 if (rg) rg.style.display = "none";
 if (ri) {
 ri.required = false;
 ri.value = "";
 }
 }

 var tot = sub + fee;
 document.getElementById(
 'billSubtotal'
 ).innerText = sub + " NT";
 document.getElementById(
 'billFee'
 ).innerText = fee + " NT";
 document.getElementById(
 'billTotal'
 ).innerText = tot + " NT";

 var btn = document.getElementById(
 'submitButton'
 );
 if (btn) {
 if (sub === 0) {
 btn.disabled = true;
 btn.innerText = "🍢 Select items";
 } else {
 btn.disabled = false;
 btn.innerText = "🚀 Submit Order";
 }
 }
}

window.addEventListener(
 'DOMContentLoaded', 
 function() {
 var inputs = document
 .querySelectorAll(
 '.item-qty-input'
 );
 inputs.forEach(function(i) {
 i.addEventListener(
 'input', 
 calculateLiveTotal
 );
 });

 var opt = document
 .getElementById(
 'fulfillmentOpt'
 );
 if (opt) opt.addEventListener(
 'change', 
 calculateLiveTotal
 );

 var form = document
 .getElementById('bbqForm');
 if (form) {
 form.addEventListener(
 'submit', 
 function(e) {
 e.preventDefault();
 var b = document
 .getElementById(
 'submitButton'
 );
 if (b) {
 b.disabled = true;
 b.innerText = "Sending...";
 }

 var fd = new FormData(form);
 
 // 1. Actively fire the background network request
 fetch(WEB_APP_URL, {
 method: 'POST',
 body: fd,
 mode: 'no-cors'
 });

 // 2. Hold page for 1.5 seconds so data finishes uploading
 setTimeout(function() {
 document.getElementById(
 'mainFormSection'
 ).style.display = 'none';
 document.getElementById(
 'successCard'
 ).style.display = 'block';
 window.scrollTo({
 top: 0, 
 behavior: 'smooth'
 });
 }, 1500);
 }
 );
 }
 calculateLiveTotal();
 }
);
</script>
</body>
</html>
