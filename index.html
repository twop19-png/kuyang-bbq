    <script>
        // Paste your exact Google Apps Script URL here
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw5UkKv8R6IOBq8CxKzMa3LZTnq5e24065Ehtn0xhu90Z86m79vd0nl-h3BKB5im0QM/exec";

        function calculateLiveTotal() {
            var porkQty = parseInt(document.getElementById('qty_pork').value) || 0;
            var atayQty = parseInt(document.getElementById('qty_atay').value) || 0;
            var tengaQty = parseInt(document.getElementById('qty_tenga').value) || 0;
            var hotdogQty = parseInt(document.getElementById('qty_hotdog').value) || 0;

            var subtotal = (porkQty * 50) + (atayQty * 30) + (tengaQty * 30) + (hotdogQty * 30);
            
            var fulfillment = document.getElementById('fulfillmentOpt').value;
            var fee = 0;
            var roomGroup = document.getElementById('roomGroup');
            var roomInput = document.getElementById('cRoom');

            if (fulfillment.includes("Room Delivery")) {
                fee = 10;
                if (roomGroup) roomGroup.style.display = "block";
                if (roomInput) roomInput.required = true;
            } else {
                fee = 0;
                if (roomGroup) roomGroup.style.display = "none";
                if (roomInput) {
                    roomInput.required = false;
                    roomInput.value = "";
                }
            }

            var total = subtotal + fee;

            document.getElementById('billSubtotal').innerText = subtotal + " NT";
            document.getElementById('billFee').innerText = fee + " NT";
            document.getElementById('billTotal').innerText = total + " NT";

            var submitBtn = document.getElementById('submitButton');
            if (submitBtn) {
                if (subtotal === 0) {
                    submitBtn.disabled = true;
                    submitBtn.innerText = "🍢 Please select at least 1 item";
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 Submit Reservation Order";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            var inputs = document.querySelectorAll('.item-qty-input');
            inputs.forEach(function(i) { i.addEventListener('input', calculateLiveTotal); });

            var opt = document.getElementById('fulfillmentOpt');
            if (opt) opt.addEventListener('change', calculateLiveTotal);

            var form = document.getElementById('bbqForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    var btn = document.getElementById('submitButton');
                    if (btn) { 
                        btn.disabled = true; 
                        btn.innerText = "Sending to kitchen..."; 
                    }

                    var formData = new FormData(form);

                    // Structured background network data request stream
                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors'
                    })
                    .then(function() {
                        // Order completed visual state switch
                        document.getElementById('mainFormSection').style.display = 'none';
                        document.getElementById('successCard').style.display = 'block';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    })
                    .catch(function(error) {
                        console.error('Network diagnostic log:', error);
                        alert('Connection Error! Please check if your Google Apps Script URL has changed, or verify your internet connection and try again.');
                        if (btn) { 
                            btn.disabled = false; 
                            btn.innerText = "🚀 Submit Reservation Order"; 
                        }
                    });
                });
            }
            calculateLiveTotal();
        });
    </script>
